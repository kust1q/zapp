run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - nakedret
    - prealloc
    - revive

linters-settings:
  govet:
    enable:
      - shadow
  revive:
    severity: warning
    # Rules will use defaults to avoid 'cannot find rule' errors in CI
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
