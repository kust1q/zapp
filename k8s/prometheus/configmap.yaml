apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: zapp
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'main'
        static_configs:
          - targets: ['main-service:8080']

      - job_name: 'search'
        static_configs:
          - targets: ['search-service:50052']
